<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スカイルーインズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* 単一ビジュアルワールド（空の遺跡・夜のUIパネル）に意図的にコミットしたゲーム画面。
     ホストのテーマに関わらず同じ絵を出すため、全色を明示的に塗る。 */
  :root{
    --bg:#070c16;
    --panel:#0f1828;
    --panel2:#152136;
    --line:#22314b;
    --line2:#33496d;
    --ink:#e9eefb;
    --dim:#8796b4;
    --mute:#55647f;
    --gold:#f6c33a;
    --red:#ff5b4f;
    --atk:#ff5b4f; --mov:#5fd36a; --jmp:#4ea8ff; --def:#9bb4ff; --trt:#ffc84a;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark } }
  :root[data-theme="dark"]{ color-scheme:dark }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  .dot{font-family:"DotGothic16","Zen Kaku Gothic New",monospace}
  .num{font-family:"M PLUS 1 Code",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
  button{font:inherit; color:inherit}

  #app{position:fixed; inset:0; display:grid; place-items:center}
  #wrap{position:relative; overflow:hidden; background:#000; box-shadow:0 0 0 1px var(--line)}
  #cv{display:block; width:100%; height:100%; image-rendering:pixelated}

  /* HUD — 位置は --u（論理1px）基準 */
  #hud{position:absolute; inset:0; pointer-events:none; transition:opacity .3s; font-size:calc(var(--u)*10)}
  .titling #hud{opacity:0}
  #hearts{position:absolute; left:calc(var(--u)*10); top:calc(var(--u)*9); display:flex; gap:calc(var(--u)*2)}
  #hearts svg{width:calc(var(--u)*14); height:calc(var(--u)*12); shape-rendering:crispEdges}
  #hearts.ouch{animation:ouch .35s}
  @keyframes ouch{0%,100%{transform:none}25%{transform:translateX(calc(var(--u)*-2))}75%{transform:translateX(calc(var(--u)*2))}}
  #coins.pop{animation:coinpop .22s ease-out}
  @keyframes coinpop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pill{position:absolute; top:calc(var(--u)*7); display:flex; align-items:center; gap:.4em;
    background:rgba(8,14,26,.62); border-radius:999px; padding:.15em .7em .15em .35em; color:#fff}
  #coins{right:calc(var(--u)*10); font-size:calc(var(--u)*11)}
  #stagelabel{left:50%; transform:translateX(-50%); padding:.2em .9em; letter-spacing:.08em; font-size:calc(var(--u)*9)}
  .coin-i{width:1em; height:1em; border-radius:50%; background:radial-gradient(circle at 38% 35%,#fff3b0 0 18%,#f6c33a 20% 62%,#c98a12 64%); box-shadow:inset 0 0 0 .08em #a46d0c}

  /* タッチ操作 */
  #touch{position:absolute; inset:auto 0 0 0; height:42%; display:none; justify-content:space-between; align-items:flex-end; padding:0 4% 4%; pointer-events:none}
  .touch #touch{display:flex}
  .tpad{display:flex; gap:12px; pointer-events:auto}
  .tb{width:64px; height:64px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:rgba(10,16,30,.45);
    display:grid; place-items:center; font-size:22px; font-weight:900; color:#fff; touch-action:none}
  .tb.on{background:rgba(255,255,255,.25)}
  .tb.a{background:rgba(226,57,47,.55)} .tb.b{background:rgba(58,120,220,.55)}

  /* オーバーレイ共通 */
  .ov{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px}
  .ov.show{display:flex}
  .btn{border:0; border-radius:10px; padding:.7em 1.6em; font-weight:700; cursor:pointer; background:var(--panel2); box-shadow:inset 0 0 0 1px var(--line2)}
  .btn:hover{background:#1c2b45}
  .btn.primary{background:#e2392f; box-shadow:none; color:#fff}
  .btn.primary:hover{background:#f04a3f}
  .btn:disabled{opacity:.4; cursor:default}
  .key{display:inline-grid; place-items:center; min-width:1.6em; height:1.6em; padding:0 .35em; border-radius:999px; background:#e9eefb; color:#0b1220; font-size:.78em; font-weight:900; margin-right:.35em}

  #ov-title{background:linear-gradient(180deg,rgba(7,12,22,.25),rgba(7,12,22,.75))}
  .title-card{text-align:center}
  .title-card h1{font-family:"DotGothic16",monospace; font-weight:400; font-size:clamp(40px,8vw,78px); margin:0; letter-spacing:.06em;
    color:#fff; text-shadow:0 4px 0 #b3261e, 0 8px 0 rgba(0,0,0,.35)}
  .title-card p{margin:.6em 0 1.8em; color:#dfe8ff; letter-spacing:.2em; font-size:14px}
  .title-card .row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .keys{margin-top:2em; color:#c6d2ee; font-size:13px; display:flex; gap:1.4em; justify-content:center; flex-wrap:wrap}

  #ov-msg{background:rgba(5,8,16,.6)}
  .msg-card{text-align:center; background:var(--panel); border:1px solid var(--line2); border-radius:16px; padding:28px 40px}
  .msg-card h2{font-family:"DotGothic16",monospace; font-weight:400; font-size:40px; margin:0 0 .3em}
  .msg-card p{color:var(--dim); margin:0 0 1.4em}

  /* スキルツリー */
  #ov-tree{background:rgba(5,9,18,.94); align-items:stretch; overflow:auto}
  .tree{width:min(1100px,100%); margin:auto; display:flex; flex-direction:column; gap:14px}
  .tree-head{display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--line); padding-bottom:10px}
  .tree-head h2{margin:0; font-size:28px; font-weight:900; letter-spacing:.04em}
  .tree-head .sub{color:var(--gold); font-weight:700}
  .tree-head .bank{margin-left:auto; display:flex; align-items:center; gap:.4em; font-size:24px; font-weight:700}
  .tree-body{display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:center}
  .graph-wrap{min-width:0; display:grid; place-items:center}
  .graph{position:relative}
  .graph svg.lines{position:absolute; inset:0; overflow:visible}
  .branch{position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--c); font-weight:900; font-size:calc(var(--ns)*.27); white-space:nowrap; pointer-events:none}
  .branch svg{width:calc(var(--ns)*.36); height:calc(var(--ns)*.36)}
  .branch .num{font-size:.8em; font-weight:700; opacity:.8}
  .root{position:absolute; width:var(--ns); height:var(--ns); border-radius:50%; display:grid; place-items:center; color:#fff; font-size:calc(var(--ns)*.42);
    background:radial-gradient(circle at 40% 35%,#ffe9a8,#f6c33a 45%,#b97c0e); box-shadow:0 0 0 3px #0b1322, 0 0 0 5px #f6c33a, 0 0 26px rgba(246,195,58,.55)}
  .node{position:absolute; width:var(--ns); height:var(--ns); border-radius:12px; border:2px solid var(--line2); background:#1a2438; cursor:pointer;
    display:grid; place-items:center; padding:0; transition:transform .1s}
  .node .g{font-size:calc(var(--ns)*.4); font-weight:900; color:var(--mute); line-height:1}
  .node .pips{position:absolute; bottom:5px; left:0; right:0; display:flex; justify-content:center; gap:3px}
  .node .pips i{width:5px; height:5px; border-radius:1px; background:#2c3a55}
  .node .lock{position:absolute; width:16px; height:16px; right:-6px; top:-6px; background:var(--panel); border-radius:50%; padding:2px; color:var(--mute)}
  .node.avail{border-color:color-mix(in srgb,var(--c) 70%,#fff 0%)}
  .node.avail .g{color:color-mix(in srgb,var(--c) 80%,#fff)}
  .node.own{border-color:var(--c); background:color-mix(in srgb,var(--c) 22%,#151d2e); box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}
  .node.own .g{color:#fff}
  .node .pips i.on{background:var(--c)}
  .node.locked{opacity:.55}
  .node.sel{transform:scale(1.1); outline:2px solid #fff; outline-offset:3px}
  .node.pop{animation:pop .35s}
  @keyframes pop{40%{transform:scale(1.25)}}
  .detail{background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
  .d-icon{height:110px; border-radius:10px; display:grid; place-items:center; font-size:56px; font-weight:900; color:#fff;
    background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%),#0b1322; border:1px solid var(--line)}
  .d-name{font-size:21px; font-weight:900}
  .d-lv{color:var(--dim); font-size:14px}
  .d-desc{font-size:14px; line-height:1.6; color:#c9d4ec; border-top:1px solid var(--line); padding-top:10px; min-height:3.2em}
  .d-stat{display:flex; justify-content:space-between; font-size:15px}
  .d-stat .to{color:var(--gold); font-weight:700}
  .d-req{font-size:13px; color:var(--red)}
  .d-cost{display:flex; align-items:center; gap:.4em; font-weight:700; border-top:1px solid var(--line); padding-top:10px}
  .d-cost.short{color:var(--red)}
  .tree-foot{display:flex; align-items:center; gap:18px; justify-content:flex-end; color:var(--dim); font-size:13px; flex-wrap:wrap}
  .tree-foot .btn.primary{font-size:16px}
  @media (max-width:860px){
    .tree-body{grid-template-columns:1fr}
    .tree-head h2{font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div id="app">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hud">
<div id="boss" hidden>キングスライム<div><i></i></div></div>
      <div id="hearts"></div>
      <div id="stagelabel" class="pill dot"></div>
      <div id="coins" class="pill num"><i class="coin-i"></i><span>0</span></div>
    </div>
    <div id="pause" hidden><strong>PAUSE</strong><span>P / Start で再開</span></div>
<div id="touch">
      <div class="tpad"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
      <div class="tpad"><div class="tb b" data-k="shoot">B</div><div class="tb a" data-k="jump">A</div></div>
    </div>
  </div>
</div>

<div id="ov-title" class="ov show">
  <div class="title-card">
    <h1>スカイルーインズ</h1>
    <p class="subtitle">空の遺跡と、君だけのスキル。</p>
    <div class="row">
      <button class="btn primary" id="b-new" disabled>読み込み中…</button>
      <button class="btn" id="b-cont">つづきから</button>
    </div>
    <div id="loading" role="status">遺跡を準備しています…</div>
<div class="keys">
      <span><span class="key">←→</span>移動</span>
      <span><span class="key">Space</span>ジャンプ</span>
      <span><span class="key">Z</span>射撃</span>
      <span><span class="key">P</span>ポーズ</span>
      <span><span class="key">M</span>音</span>
<span>ゲームパッド：十字キー / A ジャンプ / B 攻撃</span>
    </div>
  </div>
</div>

<div id="ov-msg" class="ov">
  <div class="msg-card">
    <h2 id="msg-h"></h2>
    <p id="msg-p"></p>
    <button class="btn primary" id="msg-b"></button>
  </div>
</div>

<div id="ov-tree" class="ov">
  <div class="tree">
    <div class="tree-head">
      <h2 id="t-title">スキルツリー</h2>
      <span class="sub" id="t-sub"></span>
      <span class="bank num"><i class="coin-i"></i><span id="t-bank">0</span></span>
    </div>
    <div class="tree-body">
      <div class="graph-wrap"><div class="graph" id="t-graph"></div></div>
      <div class="detail" id="t-detail"></div>
    </div>
    <div class="tree-foot">
      <span><span class="key">Z</span>取得</span>
      <span><span class="key">↑↓←→</span>選択</span>
      <span><span class="key">Enter</span>出発</span>
      <button class="btn primary" id="t-go">次のステージへ ▶</button>
    </div>
  </div>
</div>


<script type="module" src="./src/main.js"></script>
</body>
</html>
